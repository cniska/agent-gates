[tools]
bun = "1.4.2"
node = "24.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[hooks]
postinstall = "{ bun install --frozen-lockfile && if [ \"$(git rev-parse --path-format=absolute --git-dir)\" = \"$(git rev-parse --path-format=absolute --git-common-dir)\" ]; then bun link --silent; fi; } >&2"
